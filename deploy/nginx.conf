# Forgeline — nginx site config for forgeline.tech
# Install: /etc/nginx/sites-available/forgeline.tech, symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
# TLS certificates come from certbot (see docs/deployment.md); the paths below are what certbot creates.

upstream forgeline_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP: certbot's challenge, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name forgeline.tech www.forgeline.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://forgeline.tech$request_uri; }
}

# www → apex, so the canonical host is the only one serving pages.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.forgeline.tech;

    ssl_certificate     /etc/letsencrypt/live/forgeline.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forgeline.tech/privkey.pem;

    return 301 https://forgeline.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forgeline.tech;

    ssl_certificate     /etc/letsencrypt/live/forgeline.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forgeline.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Application headers come from next.config.ts; nginx only adds transport-level concerns.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Immutable build output: hashed filenames, safe to cache for a year.
    location /_next/static/ {
        proxy_pass http://forgeline_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://forgeline_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
